<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Shift testing</title><meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;height:100%;background:#f6f5f2}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body>
<!-- RSRLT (Red Shift regression and load testing): the 2.0 web app's pages. No parameters: the live dashboard (Play all opens a tab per volunteer,
     Stop closes them and resets the run). ?page=client&k=N is one volunteer's client tab. The pages inside talk tab to tab through this page:
     a message from the frame goes to this site's other tabs, and from them down into their frames. -->
<iframe id="f" title="Red Shift testing" allow="clipboard-write"></iframe>
<script>
var APP_URL = 'https://script.google.com/macros/s/AKfycbwhn2JuQWtx20rfosr5BCL3hzBP_BjcxPGghpDpEWLvJKlhdWBs0MO-UIfo7XaGkggd/exec';
var q = new URLSearchParams(location.search), u = new URL(APP_URL);
q.forEach(function (v, k) { u.searchParams.set(k, v); });
if (!q.get('page')) u.searchParams.set('page', 'dash');
u.searchParams.set('base', location.origin + location.pathname);
var F = document.getElementById('f'); F.src = u.toString();
var APP_HOSTS = /(^|\.)googleusercontent\.com$|(^|\.)google\.com$/;
var bus = null; try { bus = new BroadcastChannel('rs2bus'); } catch (e) {}
function down(d, w) { w = w || F.contentWindow; try { w.postMessage(d, '*'); } catch (e) {} try { for (var i = 0; i < w.frames.length; i++) down(d, w.frames[i]); } catch (e) {} }
window.addEventListener('message', function (e) {
  var d = e.data, h = ''; try { h = new URL(e.origin).hostname; } catch (x) {}
  if (!d || !(APP_HOSTS.test(h) || h === new URL(APP_URL).hostname)) return;
  if (d.rs2 === 'close') window.close();                       // a client tab asks to close (the dashboard's Stop)
  if (d.rs2bus && bus) bus.postMessage(d);                     // to this site's other tabs
});
if (bus) bus.onmessage = function (e) { down(e.data); };       // from them, down into this tab's frames
</script>
</body></html>
